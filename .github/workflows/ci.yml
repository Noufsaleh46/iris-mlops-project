name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t iris-api .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name iris-container iris-api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not start"
          docker logs iris-container
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

      - name: Show container logs
        if: always()
        run: |
          docker logs iris-container

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/noufsaleh46/iris-mlops-project:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/noufsaleh46/iris-mlops-project:latest
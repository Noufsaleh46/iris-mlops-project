<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Flower Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #4caf50;
        }

        button {
            width: 100%;

            padding: 13px;
            margin-top: 10px;

            background: #4caf50;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #388e3c;
        }

        #result {
            display: none;

            margin-top: 25px;
            padding: 18px;

            background: #e8f5e9;

            border-radius: 10px;

            text-align: center;
        }

        #result h2 {
            margin: 0 0 10px;

            color: #2e7d32;
        }

        #prediction {
            font-size: 24px;

            font-weight: bold;

            text-transform: capitalize;
        }

        .error {
            color: #d32f2f;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌸 Iris Flower Classifier</h1>

    <p class="description">
        Enter the flower measurements to predict its class.
    </p>

    <form id="predictionForm">

        <div class="input-group">
            <label for="sepal_length">
                Sepal Length
            </label>

            <input
                type="number"
                id="sepal_length"
                step="0.1"
                placeholder="Example: 5.1"
                required
            >
        </div>


        <div class="input-group">
            <label for="sepal_width">
                Sepal Width
            </label>

            <input
                type="number"
                id="sepal_width"
                step="0.1"
                placeholder="Example: 3.5"
                required
            >
        </div>


        <div class="input-group">
            <label for="petal_length">
                Petal Length
            </label>

            <input
                type="number"
                id="petal_length"
                step="0.1"
                placeholder="Example: 1.4"
                required
            >
        </div>


        <div class="input-group">
            <label for="petal_width">
                Petal Width
            </label>

            <input
                type="number"
                id="petal_width"
                step="0.1"
                placeholder="Example: 0.2"
                required
            >
        </div>


        <button type="submit">
            Predict
        </button>

    </form>


    <div id="result">

        <h2>
Prediction Result
        </h2>

        <div id="prediction"></div>

    </div>

</div>


<script>

document
    .getElementById("predictionForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const resultBox =
            document.getElementById("result");

        const predictionText =
            document.getElementById("prediction");


        const data = {

            sepal_length:
                parseFloat(
                    document.getElementById("sepal_length").value
                ),

            sepal_width:
                parseFloat(
                    document.getElementById("sepal_width").value
                ),

            petal_length:
                parseFloat(
                    document.getElementById("petal_length").value
                ),

            petal_width:
                parseFloat(
                    document.getElementById("petal_width").value
                )
        };


        try {

            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error || "Prediction failed"
                );

            }


            predictionText.textContent =
                result.class_name;

            predictionText.className = "";

            resultBox.style.display =
                "block";


        } catch (error) {

            predictionText.textContent =
                error.message;

            predictionText.className =
                "error";

            resultBox.style.display =
                "block";

        }

    });

</script>

</body>
</html>
